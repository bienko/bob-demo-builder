# Project info
site_name: Bob Demo-Builder Mode
site_description: Bob Demo-Builder Mode
site_author: Christopher Bienko (cdbienko@us.ibm.com)
copyright: Copyright &copy; 2026

# Repository
repo_name: bienko/bob-demo-builder
#repo_url: https://github.com/bienko/bob-demo-builder
#edit_uri: edit/master/docs
docs_dir: docs

nav:
  - Table of Contents: toc.md
  - Introduction: index.md
  - 1. Setup and registration:
    - For IBM regular employees: 1-1.md
    - For IBM Business Partners: 1-2.md
  - 2. Deploying with demo builder: 2.md
  - Practitioners guide:
    - 3. Prompting best practices: 3.md
    - 4. Deployment strategies: 4.md
    - 5. Leveraging asset templates: 5.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.footer
  palette:
      scheme: default

plugins:
  - mkdocs-video:
      is_video: True
      video_autoplay: False
  - macros
  - search
  - glightbox
  - print-site:
      add_to_navigation: false
      print_page_title: 'IBM Bob Demo-Builder Mode'
      add_print_site_banner: false
      # Table of contents
      add_table_of_contents: false
      toc_title: 'Table of Contents'
      toc_depth: 6
      # Content-related
      add_full_urls: false
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: false
      cover_page_template: ""
      path_to_pdf: ""
      include_css: true
      enabled: true

markdown_extensions:
  - sane_lists
  - pymdownx.details
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - pymdownx.tabbed

extra_css:
  - styles/override-print.css

extra_javascript:
  - _static/hide-toc-nav.js
